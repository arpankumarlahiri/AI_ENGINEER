[project]
name = "ai-engineer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arpan Lahiri", email = "arpan@medflix.app" }
]
requires-python = ">=3.13"
dependencies = [
    "docling>=2.151.1",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project.scripts]
ai-engineer = "ai_engineer:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pyrefly>=1.5.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
