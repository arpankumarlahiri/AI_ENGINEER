[project]
name = "ai-engineer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arpan Lahiri", email = "arpan@medflix.app" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-engineer = "ai_engineer:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
